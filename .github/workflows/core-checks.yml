name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environment_setup/requirements-ci.txt

      - name: Install lightweight test dependencies
        run: python -m pip install -r environment_setup/requirements-ci.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          beginner_level expert_level bonus_level bonus_level_mario

      - name: Test expression feature geometry
        run: python expert_level/test_expression_features.py

      - name: Test dance scoring
        run: python bonus_level/test_dance_scoring.py

      - name: Test Mario gesture recognition
        run: python bonus_level_mario/test_gesture_controller.py
